<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORDER COMPOND EXTRUDER AUTOSEAL</title>
    <!-- Library QR Code JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --surface: rgba(255, 255, 255, 0.98); 
            --text: #0f172a;
            --text-secondary: #475569;
            --border: #cbd5e1;
            --accent-bg: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(15, 23, 42, 0.55), rgba(15, 23, 42, 0.55)), 
                        url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            color: var(--text);
            margin: 0;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--surface);
            backdrop-filter: blur(12px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.8);
            border: 1px solid #e2e8f0;
            position: relative;
            box-sizing: border-box;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        h2 {
            margin: 0;
            color: var(--text);
            font-size: 20px;
        }

        .btn-pdf {
            background-color: #059669;
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        .btn-pdf:hover {
            background-color: #047857;
        }

        .filter-section {
            background: var(--accent-bg);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .filter-group {
            flex: 1;
            min-width: 200px;
        }

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 13px;
        }

        input[type="date"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            background-color: #ffffff;
            color: var(--text);
            box-sizing: border-box;
            outline: none;
            cursor: pointer;
        }

        input[type="date"]:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .last-update-info {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 500;
        }

        .stats {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            font-weight: 500;
        }

        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
            min-width: 500px;
        }

        th, td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        th {
            background-color: #f1f5f9;
            font-weight: 600;
            color: var(--text-secondary);
        }

        tr:hover {
            background-color: #f8fafc;
        }

        .no-data {
            text-align: center;
            padding: 30px;
            color: var(--text-secondary);
            font-style: italic;
        }

        .notes-section {
            margin-top: 15px;
            padding: 12px 16px;
            background-color: #f8fafc;
            border: 1px dashed var(--border);
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .notes-section strong {
            color: var(--text);
        }

        .notes-section ol {
            margin: 5px 0 0 0;
            padding-left: 20px;
        }

        .notes-section li {
            margin-bottom: 3px;
        }

        .qr-print-container {
            display: none;
        }

        @media (max-width: 600px) {
            body { padding: 10px 5px; }
            .container { padding: 16px; }
            h2 { font-size: 17px; }
            .filter-group { min-width: 100%; }
            th, td { padding: 8px 10px; font-size: 13px; }
        }

        @media print {
            body { background: #ffffff !important; padding: 0; }
            .container { box-shadow: none; border: none; max-width: 100%; padding: 0; background: transparent; }
            .filter-section, .btn-pdf { display: none !important; }
            th { background-color: #e2e8f0 !important; -webkit-print-color-adjust: exact; }

            .qr-print-container {
                display: flex !important;
                flex-direction: column;
                align-items: center;
                position: absolute;
                top: 0px;
                right: 0px;
                text-align: center;
            }

            .qr-print-container img, .qr-print-container canvas { width: 75px !important; height: 75px !important; }
            .qr-text { font-size: 9px; font-weight: 600; color: #334155; margin-top: 4px; max-width: 90px; line-height: 1.1; }
            .header-section { padding-right: 100px; }
            .notes-section { background-color: transparent; border: 1px solid #cbd5e1; }
        }
    </style>
</head>
<body>

<div class="container" id="areaCetak">
    <div class="qr-print-container">
        <div id="qrcode"></div>
        <div class="qr-text">Scan disini untuk melihat jadwal via web</div>
    </div>

    <div class="header-section">
        <h2>📦 ORDER COMPOND EXTRUDER AUTOSEAL</h2>
        <button class="btn-pdf" onclick="unduhPDF()">📄 Download PDF</button>
    </div>

    <div class="filter-section">
        <div class="filter-group">
            <label for="pilihSupplier">Pilih Supplier:</label>
            <select id="pilihSupplier" onchange="filterData()">
                <option value="semua">Semua Supplier (IRC & EMIX)</option>
                <option value="IRC RUBBER">IRC RUBBER</option>
                <option value="EMIX">EMIX</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="pilihTanggal">Pilih Tanggal Kedatangan:</label>
            <input type="date" id="pilihTanggal" onchange="filterData()">
        </div>
    </div>

    <!-- Informasi Last Update -->
    <div class="last-update-info">
        ⏱️ <span>Last Update: <strong id="lastUpdateText">Memuat...</strong></span>
    </div>
    
    <div id="statsSummary" class="stats"></div>

    <div class="table-responsive">
        <table id="tabelMaterial">
            <thead>
                <tr>
                    <th>Supplier</th>
                    <th>Nama Material</th>
                    <th>Jumlah Batch</th>
                    <th>Jam Kedatangan</th>
                </tr>
            </thead>
            <tbody id="isiTabel">
                <tr>
                    <td colspan="4" class="no-data">Memuat data dari GitHub...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="notes-section">
        <strong>Note:</strong>
        <ol>
            <li>1 batch = 71 kilogram (perhitungan internal ipi)</li>
        </ol>
    </div>
</div>

<script>
    // URL Raw File dari GitHub
    const URL_DATA_IRC = 'https://raw.githubusercontent.com/diandianlukmana-alt/Jadwal-kedatangan-compond/main/data_irc.txt';
    const URL_DATA_EMIX = 'https://raw.githubusercontent.com/diandianlukmana-alt/Jadwal-kedatangan-compond/main/data_emix.txt';

    let databaseKedatangan = [];

    const NAMA_BULAN = [
        "Januari", "Februari", "Maret", "April", "Mei", "Juni",
        "Juli", "Agustus", "September", "Oktober", "November", "Desember"
    ];

    window.addEventListener('DOMContentLoaded', () => {
        new QRCode(document.getElementById("qrcode"), {
            text: window.location.href,
            width: 75,
            height: 75,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        const today = new Date().toISOString().split('T')[0];
        document.getElementById('pilihTanggal').value = today;

        muatDataDariGithub();
    });

    async function muatDataDariGithub() {
        databaseKedatangan = [];

        try {
            const [resIRC, resEMIX] = await Promise.all([
                fetch(URL_DATA_IRC + '?t=' + new Date().getTime()).catch(() => null),
                fetch(URL_DATA_EMIX + '?t=' + new Date().getTime()).catch(() => null)
            ]);

            if (resIRC && resIRC.ok) {
                const teksIRC = await resIRC.text();
                prosesTeksData(teksIRC, 'IRC RUBBER');
            }

            if (resEMIX && resEMIX.ok) {
                const teksEMIX = await resEMIX.text();
                prosesTeksData(teksEMIX, 'EMIX');
            }

            // Update Tanggal/Jam Last Update
            updateWaktuLastUpdate();

            filterData();
        } catch (err) {
            console.error(err);
            document.getElementById('lastUpdateText').innerText = "Gagal memperbarui data";
        }
    }

    function updateWaktuLastUpdate() {
        const sekarang = new Date();
        const tgl = String(sekarang.getDate()).padStart(2, '0');
        const bln = NAMA_BULAN[sekarang.getMonth()];
        const thn = sekarang.getFullYear();
        const jam = String(sekarang.getHours()).padStart(2, '0');
        const menit = String(sekarang.getMinutes()).padStart(2, '0');
        const detik = String(sekarang.getSeconds()).padStart(2, '0');

        document.getElementById('lastUpdateText').innerText = `${tgl} ${bln} ${thn} pukul ${jam}:${menit}:${detik} WIB`;
    }

    function prosesTeksData(teks, defaultSupplier) {
        const barisArr = teks.split(/\r?\n/);

        barisArr.forEach(baris => {
            if (!baris.trim()) return;

            const kolom = baris.split(/;|;|\t/).map(k => k.trim());

            if (kolom.length >= 3) {
                let tgl = kolom[0];
                let supp = kolom[1] || defaultSupplier;
                let mat = kolom[2];
                let jml = kolom[3] || '-';
                let jam = kolom[4] || '-';

                if (!tgl.toLowerCase().includes('tanggal')) {
                    databaseKedatangan.push({
                        tanggal: tgl,
                        supplier: supp,
                        material: mat,
                        jumlah: jml,
                        jam: jam
                    });
                }
            }
        });
    }

    function normalkanTanggal(strTanggal) {
        if (!strTanggal) return '';
        let dateObj;

        if (typeof strTanggal === 'string' && strTanggal.includes('T')) {
            dateObj = new Date(strTanggal);
        } else if (typeof strTanggal === 'string') {
            const bersih = strTanggal.trim();
            if (bersih.includes('/')) {
                const p = bersih.split('/');
                if (p.length === 3) return `${p[2]}${p[1].padStart(2, '0')}${p[0].padStart(2, '0')}`;
            }
            if (bersih.includes('-')) {
                const p = bersih.split('-');
                if (p.length === 3) {
                    if (p[0].length === 4) return `${p[0]}${p[1].padStart(2, '0')}${p[2].padStart(2, '0')}`;
                    return `${p[2]}${p[1].padStart(2, '0')}${p[0].padStart(2, '0')}`;
                }
            }
            return bersih.replace(/[\/\-]/g, '');
        } else {
            dateObj = new Date(strTanggal);
        }

        if (dateObj && !isNaN(dateObj.getTime())) {
            const yyyy = dateObj.getFullYear();
            const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
            const dd = String(dateObj.getDate()).padStart(2, '0');
            return `${yyyy}${mm}${dd}`;
        }

        return String(strTanggal);
    }

    function filterData() {
        const tanggalDipilih = document.getElementById('pilihTanggal').value;
        const supplierDipilih = document.getElementById('pilihSupplier').value;
        const isiTabel = document.getElementById('isiTabel');
        const statsSummary = document.getElementById('statsSummary');
        
        if (!tanggalDipilih) {
            isiTabel.innerHTML = `<tr><td colspan="4" class="no-data">Silakan pilih tanggal kedatangan.</td></tr>`;
            statsSummary.innerHTML = '';
            return;
        }

        const tglPilihNorm = normalkanTanggal(tanggalDipilih);

        const hasilFilter = databaseKedatangan.filter(item => {
            const matchTanggal = normalkanTanggal(item.tanggal) === tglPilihNorm;
            const matchSupplier = (supplierDipilih === 'semua') || 
                                  (String(item.supplier).trim().toUpperCase() === supplierDipilih.toUpperCase());

            return matchTanggal && matchSupplier;
        });

        isiTabel.innerHTML = '';

        const pTgl = tanggalDipilih.split('-');
        const hari = pTgl[2];
        const bulanTeks = NAMA_BULAN[parseInt(pTgl[1], 10) - 1];
        const tahun = pTgl[0];
        const tglTampilFormatted = `${hari} ${bulanTeks} ${tahun}`;

        if (hasilFilter.length === 0) {
            statsSummary.innerHTML = `📅 Tanggal: <b>${tglTampilFormatted}</b> | Total: 0 pengiriman`;
            isiTabel.innerHTML = `<tr><td colspan="4" class="no-data">Tidak ada jadwal kedatangan material yang cocok.</td></tr>`;
            return;
        }

        let totalBatch = 0;
        hasilFilter.forEach(item => {
            if (item.jumlah && item.jumlah !== '-') {
                const nilaiAngka = parseFloat(String(item.jumlah).replace(',', '.'));
                if (!isNaN(nilaiAngka)) {
                    totalBatch += nilaiAngka;
                }
            }
        });

        const totalBatchFormatted = parseFloat(totalBatch.toFixed(2)).toString().replace('.', ',');

        statsSummary.innerHTML = `📅 Tanggal: <b>${tglTampilFormatted}</b> | 📋 Menampilkan <b>${hasilFilter.length}</b> pengiriman (Total: <b>${totalBatchFormatted}</b> batch)`;

        hasilFilter.forEach(item => {
            const baris = document.createElement('tr');
            baris.innerHTML = `
                <td><b>${item.supplier}</b></td>
                <td>${item.material}</td>
                <td>${item.jumlah}</td>
                <td>${item.jam}</td>
            `;
            isiTabel.appendChild(baris);
        });
    }

    function unduhPDF() {
        const tanggalDipilih = document.getElementById('pilihTanggal').value;
        const judulAsli = "ORDER COMPOND EXTRUDER AUTOSEAL";

        if (tanggalDipilih) {
            const pTgl = tanggalDipilih.split('-');
            const hari = pTgl[2];
            const bulanTeks = NAMA_BULAN[parseInt(pTgl[1], 10) - 1];
            const tahun = pTgl[0];
            const tglFormatted = `${hari} ${bulanTeks} ${tahun}`;

            document.title = `${judulAsli} - ${tglFormatted}`;
        } else {
            document.title = judulAsli;
        }

        window.print();

        setTimeout(() => {
            document.title = judulAsli;
        }, 1000);
    }
</script>

</body>
</html>
