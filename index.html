<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Kedatangan Compound</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --surface: rgba(255, 255, 255, 0.98); 
            --text: #0f172a;
            --text-secondary: #475569;
            --border: #cbd5e1;
            --accent-bg: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(15, 23, 42, 0.55), rgba(15, 23, 42, 0.55)), 
                        url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            color: var(--text);
            margin: 0;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--surface);
            backdrop-filter: blur(12px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.8);
            border: 1px solid #e2e8f0;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h2 {
            margin: 0;
            color: var(--text);
            font-size: 22px;
        }

        .btn-pdf {
            background-color: #059669;
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        .btn-pdf:hover {
            background-color: #047857;
        }

        .filter-section {
            background: var(--accent-bg);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .filter-group {
            flex: 1;
            min-width: 200px;
        }

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        input[type="date"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            background-color: #ffffff;
            color: var(--text);
            box-sizing: border-box;
            outline: none;
        }

        input[type="date"]:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .stats {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            font-weight: 500;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
        }

        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        th {
            background-color: #f1f5f9;
            font-weight: 600;
            color: var(--text-secondary);
        }

        tr:hover {
            background-color: #f8fafc;
        }

        .no-data {
            text-align: center;
            padding: 30px;
            color: var(--text-secondary);
            font-style: italic;
        }

        .loading {
            text-align: center;
            padding: 12px;
            color: #0369a1;
            font-weight: bold;
            font-size: 14px;
            background: #e0f2fe;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid #bae6fd;
        }

        @media print {
            body {
                background: #ffffff !important;
                padding: 0;
            }
            .container {
                box-shadow: none;
                border: none;
                max-width: 100%;
                padding: 0;
                background: transparent;
            }
            .filter-section, .btn-pdf, .loading {
                display: none !important;
            }
            th {
                background-color: #e2e8f0 !important;
                -webkit-print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>

<div class="container" id="areaCetak">
    <div class="header-section">
        <h2>🗓️ Jadwal Kedatangan Compound</h2>
        <button class="btn-pdf" onclick="unduhPDF()">📄 Download PDF</button>
    </div>

    <div class="filter-section">
        <div class="filter-group">
            <label for="pilihSupplier">Pilih Supplier:</label>
            <select id="pilihSupplier" onchange="gantiDataSupplier()">
                <option value="semua">Semua Supplier (IRC & EMIX)</option>
                <option value="data_irc.txt">IRC RUBBER</option>
                <option value="data_emix.txt">EMIX</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="pilihTanggal">Pilih Tanggal Kedatangan:</label>
            <input type="date" id="pilihTanggal" onchange="filterData()">
        </div>
    </div>

    <div id="loadingInfo" class="loading">Sedang mengambil data jadwal terbaru...</div>
    <div id="statsSummary" class="stats"></div>

    <div class="table-responsive">
        <table id="tabelMaterial">
            <thead>
                <tr>
                    <th>Supplier</th>
                    <th>Nama Material</th>
                    <th>Jumlah Batch</th>
                </tr>
            </thead>
            <tbody id="isiTabel">
                <tr>
                    <td colspan="3" class="no-data">Silakan pilih tanggal terlebih dahulu.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    let databaseKedatangan = [];

    function normalkanTanggal(strTanggal) {
        if (!strTanggal) return '';
        const bersih = strTanggal.trim();

        if (bersih.includes('/')) {
            const p = bersih.split('/');
            if (p.length === 3) {
                const dd = p[0].padStart(2, '0');
                const mm = p[1].padStart(2, '0');
                const yyyy = p[2];
                return `${yyyy}${mm}${dd}`;
            }
        }

        if (bersih.includes('-')) {
            const p = bersih.split('-');
            if (p.length === 3) {
                if (p[0].length === 4) {
                    return `${p[0]}${p[1].padStart(2, '0')}${p[2].padStart(2, '0')}`;
                }
                return `${p[2]}${p[1].padStart(2, '0')}${p[0].padStart(2, '0')}`;
            }
        }

        return bersih.replace(/[\/\-]/g, '');
    }

    async function ambilTeksFile(filename) {
        const url = `${filename}?v=${new Date().getTime()}`;
        const respon = await fetch(url);
        if (!respon.ok) throw new Error(`Gagal memuat ${filename}`);
        const teksData = await respon.text();
        
        const barisRaw = teksData.split(/\r?\n/);
        const dataParsed = [];

        for (let i = 0; i < barisRaw.length; i++) {
            if (!barisRaw[i].trim()) continue;
            
            const kolom = barisRaw[i].split(';').map(sel => sel.trim());
            if (kolom.length < 3) continue;
            
            dataParsed.push({
                tanggal: kolom[0],
                supplier: kolom[1],
                material: kolom[2],
                jumlah: kolom[3] || '-'
            });
        }
        return dataParsed;
    }

    async function muatDataInternal() {
        const supplierDipilih = document.getElementById('pilihSupplier').value;
        const loadingEl = document.getElementById('loadingInfo');
        
        loadingEl.style.display = 'block';
        loadingEl.style.backgroundColor = '#e0f2fe';
        loadingEl.style.borderColor = '#bae6fd';
        loadingEl.style.color = '#0369a1';
        loadingEl.innerHTML = 'Sedang mengambil data jadwal terbaru...';

        try {
            databaseKedatangan = [];

            if (supplierDipilih === 'semua') {
                const [dataIRC, dataEMIX] = await Promise.all([
                    ambilTeksFile('data_irc.txt'),
                    ambilTeksFile('data_emix.txt')
                ]);
                databaseKedatangan = [...dataIRC, ...dataEMIX];
            } else {
                databaseKedatangan = await ambilTeksFile(supplierDipilih);
            }

            loadingEl.style.display = 'none';
            filterData();
        } catch (error) {
            console.error(error);
            loadingEl.style.backgroundColor = '#fee2e2';
            loadingEl.style.borderColor = '#fca5a5';
            loadingEl.style.color = '#991b1b';
            loadingEl.innerHTML = '❌ Gagal memuat data file internal.';
        }
    }

    function gantiDataSupplier() {
        muatDataInternal();
    }

    function filterData() {
        const tanggalDipilih = document.getElementById('pilihTanggal').value;
        const isiTabel = document.getElementById('isiTabel');
        const statsSummary = document.getElementById('statsSummary');
        
        if (!tanggalDipilih) return;

        const tglPilihNorm = normalkanTanggal(tanggalDipilih);

        const hasilFilter = databaseKedatangan.filter(item => {
            if (!item.tanggal) return false;
            return normalkanTanggal(item.tanggal) === tglPilihNorm;
        });

        isiTabel.innerHTML = '';

        if (hasilFilter.length === 0) {
            statsSummary.innerHTML = `Total: 0 pengiriman`;
            isiTabel.innerHTML = `<tr><td colspan="3" class="no-data">Tidak ada jadwal kedatangan material pada tanggal ini.</td></tr>`;
            return;
        }

        // Menghitung total jumlah batch (mengonversi koma ke titik untuk desimal)
        let totalBatch = 0;
        hasilFilter.forEach(item => {
            if (item.jumlah && item.jumlah !== '-') {
                const nilaiAngka = parseFloat(item.jumlah.replace(',', '.'));
                if (!isNaN(nilaiAngka)) {
                    totalBatch += nilaiAngka;
                }
            }
        });

        // Format angka desimal agar rapi (misal: jika desimal gunakan koma kembali)
        const totalBatchFormatted = parseFloat(totalBatch.toFixed(2)).toString().replace('.', ',');

        statsSummary.innerHTML = `📋 Menampilkan <b>${hasilFilter.length}</b> pengiriman material (Total: <b>${totalBatchFormatted}</b> batch)`;

        hasilFilter.forEach(item => {
            const baris = document.createElement('tr');
            baris.innerHTML = `
                <td><b>${item.supplier}</b></td>
                <td>${item.material}</td>
                <td>${item.jumlah}</td>
            `;
            isiTabel.appendChild(baris);
        });
    }

    function unduhPDF() {
        window.print();
    }

    window.onload = muatDataInternal;
</script>

</body>
</html>
