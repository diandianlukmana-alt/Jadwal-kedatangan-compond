<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Kedatangan Compond</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --background: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--surface);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3);
        }
        h2 {
            margin-top: 0;
            color: #ffffff;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
            font-size: 22px;
        }
        .filter-section {
            margin: 20px 0;
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        label {
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }
        input[type="date"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 16px;
            background-color: var(--surface);
            color: white;
            box-sizing: border-box;
            outline: none;
        }
        input[type="date"]:focus {
            border-color: var(--primary);
        }
        .stats {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            font-weight: 500;
        }
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        th {
            background-color: #0f172a;
            font-weight: 600;
            color: var(--text-secondary);
        }
        tr:hover {
            background-color: #243249;
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .status-selready { background-color: #1e4620; color: #bbf7d0; }
        .status-proses { background-color: #614e1a; color: #fef08a; }
        .status-tertunda { background-color: #622525; color: #fecaca; }
        .no-data {
            text-align: center;
            padding: 30px;
            color: var(--text-secondary);
            font-style: italic;
        }
        .loading {
            text-align: center;
            padding: 15px;
            color: #38bdf8;
            font-weight: bold;
            font-size: 14px;
            background: #0c4a6e;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid #0369a1;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🗓️ Jadwal Kedatangan Compond</h2>
    
    <div class="filter-section">
        <label for="pilihTanggal">Pilih Tanggal Kedatangan:</label>
        <input type="date" id="pilihTanggal" onchange="filterData()">
    </div>

    <div id="loadingInfo" class="loading">Sedang mengambil data jadwal terbaru...</div>
    <div id="statsSummary" class="stats"></div>

    <div class="table-responsive">
        <table id="tabelMaterial">
            <thead>
                <tr>
                    <th>Supplier</th>
                    <th>Nama Material</th>
                    <th>Jumlah</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="isiTabel">
                <tr>
                    <td colspan="4" class="no-data">Silakan pilih tanggal terlebih dahulu.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // ID PASTEBIN PERMANEN ANDA SUDAH SAYA PASANG DI SINI
    const PASTEBIN_ID = 'EuQ2CABu';
    let databaseKedatangan = [];

    async function muatDataOnline() {
        // Menggunakan proxy AllOrigins dengan timestamp agar data di HP selalu paling baru saat di-refresh
        const url = `https://allorigins.win{encodeURIComponent('https://pastebin.com' + PASTEBIN_ID)}&timestamp=${new Date().getTime()}`;
        const loadingEl = document.getElementById('loadingInfo');
        
        try {
            const respon = await fetch(url);
            const hasilEksternal = await respon.json();
            const teksData = hasilEksternal.contents;
            
            const barisRaw = teksData.split(/\r?\n/);
            databaseKedatangan = [];
            
            for (let i = 0; i < barisRaw.length; i++) {
                if (!barisRaw[i].trim()) continue;
                
                const kolom = barisRaw[i].split(';').map(sel => sel.trim());
                if (kolom.length < 4) continue;
                
                databaseKedatangan.push({
                    tanggal: kolom[0],
                    supplier: kolom[1],
                    material: kolom[2],
                    jumlah: kolom[3],
                    status: kolom[4] || 'Proses'
                });
            }
            loadingEl.style.display = 'none';
        } catch (error) {
            console.error(error);
            loadingEl.style.backgroundColor = '#7f1d1d';
            loadingEl.style.borderColor = '#b91c1c';
            loadingEl.style.color = '#fecaca';
            loadingEl.innerHTML = '❌ Gagal memuat data online. Pastikan koneksi internet stabil.';
        }
    }

    function filterData() {
        const tanggalDipilih = document.getElementById('pilihTanggal').value;
        const isiTabel = document.getElementById('isiTabel');
        const statsSummary = document.getElementById('statsSummary');
        
        if (!tanggalDipilih) return;

        const hasilFilter = databaseKedatangan.filter(item => {
            if (!item.tanggal) return false;
            const tglData = item.tanggal.replace(/[\/\-]/g, '').trim();
            const tglPilih = tanggalDipilih.replace(/[\/\-]/g, '').trim();
            return tglData === tglPilih;
        });

        isiTabel.innerHTML = '';

        if (hasilFilter.length === 0) {
            statsSummary.innerHTML = `Total: 0 pengiriman`;
            isiTabel.innerHTML = `<tr><td colspan="4" class="no-data">Tidak ada jadwal kedatangan material pada tanggal ini.</td></tr>`;
            return;
        }

        statsSummary.innerHTML = `📋 Menampilkan <b>${hasilFilter.length}</b> pengiriman material`;

        hasilFilter.forEach(item => {
            const baris = document.createElement('tr');
            let statusClass = 'status-proses';
            const statusTeks = item.status.toLowerCase().trim();
            
            if (statusTeks === 'selesai') statusClass = 'status-selready';
            if (statusTeks === 'tertunda') statusClass = 'status-tertunda';

            baris.innerHTML = `
                <td><b>${item.supplier}</b></td>
                <td>${item.material}</td>
                <td>${item.jumlah}</td>
                <td><span class="badge ${statusClass}">${item.status}</span></td>
            `;
            isiTabel.appendChild(baris);
        });
    }

    window.onload = muatDataOnline;
</script>

</body>
</html>
