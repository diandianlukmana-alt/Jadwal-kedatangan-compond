<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Kedatangan Compound</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --background: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--surface);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3);
        }
        h2 {
            margin-top: 0;
            color: #ffffff;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
            font-size: 22px;
        }
        .filter-section {
            margin: 20px 0;
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .filter-group {
            flex: 1;
            min-width: 200px;
        }
        label {
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }
        input[type="date"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 16px;
            background-color: var(--surface);
            color: white;
            box-sizing: border-box;
            outline: none;
        }
        input[type="date"]:focus, select:focus {
            border-color: var(--primary);
        }
        .stats {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            font-weight: 500;
        }
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        th {
            background-color: #0f172a;
            font-weight: 600;
            color: var(--text-secondary);
        }
        tr:hover {
            background-color: #243249;
        }
        .no-data {
            text-align: center;
            padding: 30px;
            color: var(--text-secondary);
            font-style: italic;
        }
        .loading {
            text-align: center;
            padding: 15px;
            color: #38bdf8;
            font-weight: bold;
            font-size: 14px;
            background: #0c4a6e;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid #0369a1;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🗓️ Jadwal Kedatangan Compound</h2>
    
    <div class="filter-section">
        <div class="filter-group">
            <label for="pilihSupplier">Pilih Supplier:</label>
            <select id="pilihSupplier" onchange="gantiDataSupplier()">
                <option value="semua">Semua Supplier (IRC & EMIX)</option>
                <option value="data_irc.txt">IRC RUBBER</option>
                <option value="data_emix.txt">EMIX</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="pilihTanggal">Pilih Tanggal Kedatangan:</label>
            <input type="date" id="pilihTanggal" onchange="filterData()">
        </div>
    </div>

    <div id="loadingInfo" class="loading">Sedang mengambil data jadwal terbaru...</div>
    <div id="statsSummary" class="stats"></div>

    <div class="table-responsive">
        <table id="tabelMaterial">
            <thead>
                <tr>
                    <th>Supplier</th>
                    <th>Nama Material</th>
                    <th>Jumlah</th>
                    <th>Unit</th>
                </tr>
            </thead>
            <tbody id="isiTabel">
                <tr>
                    <td colspan="4" class="no-data">Silakan pilih tanggal terlebih dahulu.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    let databaseKedatangan = [];

    // Fungsi membaca file teks dan parsing baris ke objek
    async function ambilTeksFile(filename) {
        const url = `${filename}?v=${new Date().getTime()}`;
        const respon = await fetch(url);
        if (!respon.ok) throw new Error(`Gagal memuat ${filename}`);
        const teksData = await respon.text();
        
        const barisRaw = teksData.split(/\r?\n/);
        const dataParsed = [];

        for (let i = 0; i < barisRaw.length; i++) {
            if (!barisRaw[i].trim()) continue;
            
            const kolom = barisRaw[i].split(';').map(sel => sel.trim());
            if (kolom.length < 4) continue;
            
            dataParsed.push({
                tanggal: kolom[0],
                supplier: kolom[1],
                material: kolom[2],
                jumlah: kolom[3],
                unit: kolom[4] || '-'
            });
        }
        return dataParsed;
    }

    // Fungsi memuat data berdasarkan pilihan dropdown supplier
    async function muatDataInternal() {
        const supplierDipilih = document.getElementById('pilihSupplier').value;
        const loadingEl = document.getElementById('loadingInfo');
        
        loadingEl.style.display = 'block';
        loadingEl.style.backgroundColor = '#0c4a6e';
        loadingEl.style.borderColor = '#0369a1';
        loadingEl.style.color = '#38bdf8';
        loadingEl.innerHTML = 'Sedang mengambil data jadwal terbaru...';

        try {
            databaseKedatangan = [];

            if (supplierDipilih === 'semua') {
                // Ambil kedua file secara bersamaan jika memilih 'Semua'
                const [dataIRC, dataEMIX] = await Promise.all([
                    ambilTeksFile('data_irc.txt'),
                    ambilTeksFile('data_emix.txt')
                ]);
                databaseKedatangan = [...dataIRC, ...dataEMIX];
            } else {
                // Ambil file spesifik sesuai pilihan dropdown
                databaseKedatangan = await ambilTeksFile(supplierDipilih);
            }

            loadingEl.style.display = 'none';
            filterData(); // Perbarui tabel jika tanggal sudah dipilih
        } catch (error) {
            console.error(error);
            loadingEl.style.backgroundColor = '#7f1d1d';
            loadingEl.style.borderColor = '#b91c1c';
            loadingEl.style.color = '#fecaca';
            loadingEl.innerHTML = '❌ Gagal memuat data file internal GitHub.';
        }
    }

    function gantiDataSupplier() {
        muatDataInternal();
    }

    function filterData() {
        const tanggalDipilih = document.getElementById('pilihTanggal').value;
        const isiTabel = document.getElementById('isiTabel');
        const statsSummary = document.getElementById('statsSummary');
        
        if (!tanggalDipilih) return;

        const hasilFilter = databaseKedatangan.filter(item => {
            if (!item.tanggal) return false;
            const tglData = item.tanggal.replace(/[\/\-]/g, '').trim();
            const tglPilih = tanggalDipilih.replace(/[\/\-]/g, '').trim();
            return tglData === tglPilih;
        });

        isiTabel.innerHTML = '';

        if (hasilFilter.length === 0) {
            statsSummary.innerHTML = `Total: 0 pengiriman`;
            isiTabel.innerHTML = `<tr><td colspan="4" class="no-data">Tidak ada jadwal kedatangan material pada tanggal ini.</td></tr>`;
            return;
        }

        statsSummary.innerHTML = `📋 Menampilkan <b>${hasilFilter.length}</b> pengiriman material`;

        hasilFilter.forEach(item => {
            const baris = document.createElement('tr');

            baris.innerHTML = `
                <td><b>${item.supplier}</b></td>
                <td>${item.material}</td>
                <td>${item.jumlah}</td>
                <td>${item.unit}</td>
            `;
            isiTabel.appendChild(baris);
        });
    }

    window.onload = muatDataInternal;
</script>

</body>
</html>
