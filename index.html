<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORDER COMPOND EXTRUDER AUTOSEAL</title>
    <!-- Library QR Code JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #059669;
            --success-hover: #047857;
            --warning: #d97706;
            --warning-hover: #b45309;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --surface: rgba(255, 255, 255, 0.95);
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --accent-bg: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.75), rgba(15, 23, 42, 0.85)),
                        url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            background: var(--surface);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            padding: 30px;
            box-sizing: border-box;
            margin-top: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: var(--success-hover); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: var(--danger-hover); }

        .filter-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
            background: var(--accent-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        @media (max-width: 768px) {
            .filter-section { grid-template-columns: 1fr; }
        }

        .filter-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select, input[type="date"], input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            background: white;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .sync-status {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            background: white;
            font-size: 0.95rem;
        }

        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: #f8fafc;
            color: var(--text-secondary);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }

        tr:hover { background: #fdfdfe; }

        .action-cell {
            display: flex;
            gap: 8px;
        }

        .btn-edit { background: var(--warning); color: white; padding: 6px 12px; font-size: 0.8rem; }
        .btn-edit:hover { background: var(--warning-hover); }
        .btn-delete { background: var(--danger); color: white; padding: 6px 12px; font-size: 0.8rem; }
        .btn-delete:hover { background: var(--danger-hover); }

        .note-box {
            margin-top: 25px;
            background: #fffbeb;
            border: 1px solid #fef3c7;
            padding: 15px;
            border-radius: 8px;
            color: #92400e;
            font-size: 0.9rem;
        }

        .note-box strong { display: block; margin-bottom: 5px; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 650px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .modal-header h3 { margin: 0; font-size: 1.2rem; }
        .close-modal { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-secondary); }

        .mass-row {
            display: grid;
            grid-template-columns: 2fr 2fr 1fr auto;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        @media(max-width: 600px) {
            .mass-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>📦 ORDER COMPOND EXTRUDER AUTOSEAL</h1>
            <div class="btn-group">
                <button class="btn-primary" onclick="bukaModalOrder()">+ Input Order</button>
                <button class="btn-success" onclick="downloadPDF()">📥 Download PDF</button>
            </div>
        </header>

        <div class="filter-section">
            <div class="filter-group">
                <label>Pilih Supplier:</label>
                <select id="filterSupplier" onchange="renderTabel()">
                    <option value="">Semua Supplier</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Pilih Tanggal Kedatangan:</label>
                <input type="date" id="filterTanggal" onchange="renderTabel()">
            </div>
        </div>

        <div class="sync-status">
            <span id="textStatus">🔄 Auto-Sync: Memuat...</span>
            <span id="infoTotal">Menampilkan 0 data</span>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Supplier</th>
                        <th>Nama Material</th>
                        <th>Jumlah Batch</th>
                        <th class="action-col">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tabelBody">
                    <tr><td colspan="4" style="text-align: center; color: var(--text-secondary);">Memuat data dari Google Sheets...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="note-box">
            <strong>Note:</strong>
            1. 1 batch = 71 kilogram (perhitungan internal ipi)
        </div>
    </div>

    <!-- Modal Form Order -->
    <div class="modal" id="modalOrder">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Tambah Order Massal</h3>
                <button class="close-modal" onclick="tutupModalOrder()">✕</button>
            </div>
            <form id="formOrder" onsubmit="simpanData(event)">
                <input type="hidden" id="editRowId">
                <div class="filter-group" style="margin-bottom: 15px;">
                    <label>Tanggal Kedatangan:</label>
                    <input type="date" id="inputTanggal" required>
                </div>

                <div id="singleEditContainer" style="display: none; margin-bottom: 15px;">
                    <!-- Digunakan khusus untuk mode Revisi satuan -->
                    <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px;">
                        <div>
                            <label style="font-size:0.8rem; font-weight:700;">Supplier</label>
                            <input type="text" id="inputSupplier">
                        </div>
                        <div>
                            <label style="font-size:0.8rem; font-weight:700;">Material</label>
                            <input type="text" id="inputMaterial">
                        </div>
                        <div>
                            <label style="font-size:0.8rem; font-weight:700;">Jumlah Batch</label>
                            <input type="number" step="any" id="inputJumlah">
                        </div>
                    </div>
                </div>

                <div id="massContainer">
                    <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-secondary); display:block; margin-bottom: 8px;">Daftar Material yang Diorder:</label>
                    <div id="listBarisMaterial"></div>
                    <button type="button" class="btn-success" style="margin-top: 10px; font-size: 0.85rem; padding: 6px 12px;" onclick="tambahBarisMaterial()">+ Tambah Baris Material</button>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 25px;">
                    <button type="button" class="btn-danger" style="background: #64748b;" onclick="tutupModalOrder()">Batal</button>
                    <button type="submit" class="btn-primary" id="btnSimpan">Menyimpan...</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // GANTI URL DI BAWAH INI DENGAN WEB APP URL ANDA DARI GOOGLE APPS SCRIPT (/exec)
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw0nMMpyFb2TGgiMlYE1bWxQ7Nma4mI1VPCxVGKPMzzUUtsU_nxc8Ubu2D9zEdJrCzz/exec";

        let semuaDataGlobal = [];
        const masterSupplierList = [
            "PT. ELASTOMIX",
            "PT. IRC RUBBER MIX.PLANT"
        ];
        const masterMaterialList = [
            "M-6810 Rev.04",
            "M-6022 Rev.04",
            "M-6716 Rev.03",
            "E-6024",
            "E-6715",
            "E-1025",
            "E-6715 ribbon kecil",
            "E-6714"
        ];

        window.addEventListener("DOMContentLoaded", () => {
            // Set tanggal hari ini ke filter
            let today = new Date().toISOString().split('T')[0];
            document.getElementById("filterTanggal").value = today;
            
            isiDropdownSupplierFilter();
            ambilDataOrder(true);
        });

        function isiDropdownSupplierFilter() {
            let select = document.getElementById("filterSupplier");
            masterSupplierList.forEach(sup => {
                let opt = document.createElement("option");
                opt.value = sup;
                opt.innerText = sup;
                select.appendChild(opt);
            });
        }

        async function ambilDataOrder(isInitial = false) {
            if (isInitial) {
                document.getElementById("tabelBody").innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-secondary);">Memuat data dari Google Sheets...</td></tr>`;
            }
            document.getElementById("textStatus").innerText = "🔄 Auto-Sync: Memuat...";

            try {
                let response = await fetch(WEB_APP_URL);
                let result = await response.json();
                
                if (result.status === "success") {
                    semuaDataGlobal = result.data;
                    renderTabel();
                    let nowStr = new Date().toLocaleString("id-ID");
                    document.getElementById("textStatus").innerText = "🟢 Auto-Sync: " + nowStr;
                } else {
                    document.getElementById("textStatus").innerText = "🔴 Auto-Sync Gagal";
                }
            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById("textStatus").innerText = "🔴 Auto-Sync Terputus";
                if (isInitial) {
                    document.getElementById("tabelBody").innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--danger);">Gagal memuat data dari server.</td></tr>`;
                }
            }
        }

        function renderTabel() {
            let filterSup = document.getElementById("filterSupplier").value;
            let filterTgl = document.getElementById("filterTanggal").value;
            let tbody = document.getElementById("tabelBody");
            
            let filtered = semuaDataGlobal.filter(row => {
                let matchSup = filterSup === "" || row.supplier === filterSup;
                let matchTgl = filterTgl === "" || row.tanggal === filterTgl;
                return matchSup && matchTgl;
            });

            tbody.innerHTML = "";
            let totalBatch = 0;

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-secondary);">Tidak ada data untuk filter yang dipilih.</td></tr>`;
                document.getElementById("infoTotal").innerText = "Menampilkan 0 data (Total: 0 Batch)";
                return;
            }

            filtered.forEach(row => {
                totalBatch += parseFloat(row.jumlah || 0);
                let tr = document.createElement("tr");
                
                // Cek otorisasi sederhana untuk tombol aksi
                let displayActionBtn = "inline-block";

                tr.innerHTML = `
                    <td><strong>${row.supplier || "-"}</strong></td>
                    <td>${row.material || "-"}</td>
                    <td>${row.jumlah || "-"}</td>
                    <td class="action-col">
                        <div class="action-cell">
                            <button class="btn-edit" style="display: ${displayActionBtn};" onclick='mintaLoginDanEdit(${JSON.stringify(row)})'>✏️ Revisi</button>
                            <button class="btn-delete" style="display: ${displayActionBtn};" onclick='konfirmasiHapus(${row.rowId})'>🗑️ Hapus</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById("infoTotal").innerText = `Menampilkan ${filtered.length} data (Total: ${totalBatch.toFixed(1)} Batch)`;
        }

        function bukaModalOrder() {
            let pass = prompt("Masukkan PIN/Password untuk Input Order:");
            if (pass !== "1234" && pass !== "admin") {
                if (pass !== null) alert("Password salah!");
                return;
            }

            document.getElementById("editRowId").value = "";
            document.getElementById("modalTitle").innerText = "Tambah Order Massal";
            document.getElementById("inputTanggal").value = document.getElementById("filterTanggal").value || new Date().toISOString().split('T')[0];
            document.getElementById("singleEditContainer").style.display = "none";
            document.getElementById("massContainer").style.display = "block";
            document.getElementById("btnSimpan").innerText = "Simpan Order";
            document.getElementById("listBarisMaterial").innerHTML = "";
            
            // Tambah 1 baris default
            tambahBarisMaterial();
            document.getElementById("modalOrder").style.display = "flex";
        }

        function tutupModalOrder() {
            document.getElementById("modalOrder").style.display = "none";
        }

        function tambahBarisMaterial() {
            let container = document.getElementById("listBarisMaterial");
            let div = document.createElement("div");
            div.className = "mass-row";
            
            let matSelect = `<select class="mass-material" required>`;
            masterMaterialList.forEach(m => matSelect += `<option value="${m}">${m}</option>`);
            matSelect += `</select>`;

            let supSelect = `<select class="mass-supplier" required>`;
            masterSupplierList.forEach(s => supSelect += `<option value="${s}">${s}</option>`);
            supSelect += `</select>`;

            div.innerHTML = `
                ${matSelect}
                ${supSelect}
                <input type="number" class="mass-jumlah" placeholder="Jumlah" step="any" required>
                <button type="button" class="btn-danger" style="padding: 10px;" onclick="this.parentElement.remove()">✕</button>
            `;
            container.appendChild(div);
        }

        function mintaLoginDanEdit(row) {
            let pass = prompt("Masukkan PIN/Password untuk melakukan Revisi Data:");
            if (pass === "1234" || pass === "admin") { // Password sederhana bisa disesuaikan
                bukaModalEdit(row);
            } else if (pass !== null) {
                alert("Password salah!");
            }
        }

        function bukaModalEdit(row) {
            document.getElementById("editRowId").value = row.rowId;
            document.getElementById("modalTitle").innerText = "Revisi Data Order";
            document.getElementById("inputTanggal").value = row.tanggal;
            
            document.getElementById("singleEditContainer").style.display = "block";
            document.getElementById("massContainer").style.display = "none";
            
            document.getElementById("inputSupplier").value = row.supplier;
            document.getElementById("inputMaterial").value = row.material;
            document.getElementById("inputJumlah").value = row.jumlah;
            
            document.getElementById("btnSimpan").innerText = "Simpan Perubahan";
            document.getElementById("modalOrder").style.display = "flex";
        }

        async function simpanData(event) {
            event.preventDefault();
            
            let rowId = document.getElementById("editRowId").value;
            let tglValue = document.getElementById("inputTanggal").value;
            let payload = {};

            if (rowId) {
                payload = {
                    action: "edit",
                    rowId: parseInt(rowId),
                    tanggal: tglValue,
                    supplier: document.getElementById("inputSupplier").value,
                    material: document.getElementById("inputMaterial").value,
                    jumlah: document.getElementById("inputJumlah").value
                };
            } else {
                let rowElements = document.querySelectorAll(".mass-row");
                if (rowElements.length === 0) {
                    alert("Harap tambahkan minimal 1 baris material.");
                    return;
                }
                
                let items = [];
                rowElements.forEach(el => {
                    items.push({
                        tanggal: tglValue,
                        material: el.querySelector(".mass-material").value,
                        supplier: el.querySelector(".mass-supplier").value,
                        jumlah: el.querySelector(".mass-jumlah").value
                    });
                });

                payload = {
                    action: "add",
                    items: items
                };
            }

            let btnSimpan = document.getElementById("btnSimpan");
            btnSimpan.innerText = "⏳ Sedang Menyimpan...";
            btnSimpan.disabled = true;

            try {
                // Menggunakan mode no-cors agar lolos dari pembatasan browser POST ke Apps Script
                await fetch(WEB_APP_URL, {
                    method: "POST",
                    mode: "no-cors",
                    body: JSON.stringify(payload)
                });
                
                setTimeout(async () => {
                    tutupModalOrder();
                    await ambilDataOrder(false);
                    btnSimpan.innerText = "Simpan Order";
                    btnSimpan.disabled = false;
                }, 1500);

            } catch (error) {
                console.error("Error:", error);
                tutupModalOrder();
                await ambilDataOrder(false);
                btnSimpan.innerText = "Simpan Order";
                btnSimpan.disabled = false;
            }
        }

        async function konfirmasiHapus(rowId) {
            let pass = prompt("Masukkan PIN/Password untuk menghapus data:");
            if (pass !== "1234" && pass !== "admin") {
                if (pass !== null) alert("Password salah!");
                return;
            }

            if (confirm("Apakah Anda yakin ingin menghapus data ini?")) {
                try {
                    await fetch(WEB_APP_URL, {
                        method: "POST",
                        mode: "no-cors",
                        body: JSON.stringify({ action: "delete", rowId: rowId })
                    });
                    setTimeout(async () => {
                        await ambilDataOrder(false);
                    }, 1500);
                } catch (error) {
                    console.error("Error:", error);
                    alert("Gagal menghapus data.");
                }
            }
        }

        function downloadPDF() {
            window.print();
        }
    </script>
</body>
</html>
